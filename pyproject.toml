[project]
name = "voice-rag"
version = "0.1.0"
requires-python = ">=3.11"
# Mirrors requirements.txt (pytest omitted — test-only, not needed at runtime).
dependencies = [
    # Listed explicitly (though it arrives via sentence-transformers anyway)
    # because [tool.uv.sources] below only applies to direct dependencies.
    "torch",
    "sentence-transformers",
    "faiss-cpu",
    "numpy",
    "pydantic",
    "datasets",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "anthropic",
    "groq",
    "requests",
    "websockets",
    "python-dotenv",
    "tenacity",
    "boto3",
]

# src/ is imported from the working directory, not installed as a package, so
# uv should resolve dependencies without trying to build this project itself.
[tool.uv]
package = false

# Pull torch from PyTorch's CPU-only index. The default PyPI wheel on Linux
# drags in ~2.5 GB of CUDA libraries this service never uses; EMBEDDING_DEVICE
# is pinned to "cpu" in src/vectorstore.py regardless.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel]
entrypoint = "src.api:app"
