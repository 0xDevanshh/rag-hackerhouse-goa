services:
  # ── Python FastAPI backend ─────────────────────────────────────────────
  - type: web
    name: voice-rag-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: CORPUS
        value: msmarco
      - key: CORPUS_LANGUAGE
        value: hi
      - key: CORPUS_SPLIT
        value: validation
      - key: CORPUS_LIMIT
        value: "500"
      - key: CORPUS_INCLUDE_ENGLISH
        value: "1"
      - key: RAG_TARGET_MS
        value: "200"
      - key: LLM_PREWARM_TIMEOUT_SECONDS
        value: "5"
      - key: ALLOWED_ORIGIN
        sync: false   # set to your frontend URL in the Render dashboard
    autoDeploy: true

  # ── Next.js frontend ───────────────────────────────────────────────────
  - type: web
    name: voice-rag-frontend
    runtime: node
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false   # set to your backend service URL in the Render dashboard
      - key: NODE_VERSION
        value: "20"
    autoDeploy: true
