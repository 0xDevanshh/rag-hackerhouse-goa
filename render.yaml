services:
  # ── Python FastAPI backend ─────────────────────────────────────────────
  - type: web
    name: voice-rag-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: CORPUS
        value: msmarco
      - key: CORPUS_LANGUAGE
        value: hi
      - key: CORPUS_SPLIT
        value: validation
      - key: CORPUS_LIMIT
        value: "500"
      - key: CORPUS_INCLUDE_ENGLISH
        value: "1"
      - key: RAG_TARGET_MS
        value: "200"
      - key: LLM_PREWARM_TIMEOUT_SECONDS
        value: "5"
      - key: ALLOWED_ORIGIN
        sync: false   # set to your frontend URL in the Render dashboard
      - key: RAG_ARTIFACT_BUCKET
        sync: false
      - key: RAG_ARTIFACT_PREFIX
        sync: false
      - key: RAG_ARTIFACT_VERSION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
    autoDeploy: true

